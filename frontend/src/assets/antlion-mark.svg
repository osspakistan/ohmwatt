<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <style>
    :root {
      --shell-color: #202020;
      --fill-color: #644a40;
      --ceiling-opacity: 0.35;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --shell-color: #eeeeee;
        --fill-color: #ffe0c2;
        --ceiling-opacity: 0.45;
      }
    }
  </style>
  <!-- Battery Outer Shell -->
  <rect x="12.5" y="9" width="23" height="35" rx="6.5" stroke="var(--shell-color)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Terminal Cap -->
  <rect x="19" y="3" width="10" height="5.5" rx="2" fill="var(--shell-color)"/>
  <!-- Capacity Ceiling Line (Aging indicator) -->
  <path d="M18 19.5h12" stroke="var(--shell-color)" stroke-width="3" stroke-linecap="round" opacity="var(--ceiling-opacity)"/>
  <!-- Active Charge Level Fill -->
  <rect x="18" y="25" width="12" height="13" rx="3" fill="var(--fill-color)"/>
</svg>
