<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- Rounded App Tile -->
  <rect width="512" height="512" rx="115" fill="#111111"/>
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="2" y="2" width="508" height="508" rx="113" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>

  <!-- Scaled Battery Mark (Base 48x48 scaled by 6.8x, centered at (256, 260)) -->
  <g transform="translate(93, 76) scale(6.8)">
    <!-- Battery Outer Shell -->
    <rect x="12.5" y="9" width="23" height="35" rx="6.5" stroke="#eeeeee" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Terminal Cap -->
    <rect x="19" y="3" width="10" height="5.5" rx="2" fill="#eeeeee"/>
    <!-- Capacity Ceiling Line -->
    <path d="M18 19.5h12" stroke="#eeeeee" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <!-- Active Charge Level Fill (Peach / Warm Caffeine Accent) -->
    <rect x="18" y="25" width="12" height="13" rx="3" fill="#ffe0c2"/>
  </g>
</svg>
