name: Release Antlion Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Linux Packages
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libgtk-4-dev libwebkitgtk-6.0-dev build-essential

      - name: Install Wails v3 CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install Frontend Dependencies & Quality Check
        working-directory: ./frontend
        run: |
          bun install --frozen-lockfile
          bun run check

      - name: Build Linux Packages
        run: |
          wails3 task linux:create:deb
          wails3 task linux:create:rpm
          wails3 task linux:create:aur
          wails3 task linux:create:tarball
          wails3 task linux:create:appimage

      - name: Generate Cryptographic Checksums
        working-directory: ./bin
        run: |
          sha256sum antlion-app.deb antlion-app.rpm antlion-app.pkg.tar.zst antlion-linux-amd64.tar.gz antlion-app-x86_64.AppImage > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/antlion-app.deb
            bin/antlion-app.rpm
            bin/antlion-app.pkg.tar.zst
            bin/antlion-linux-amd64.tar.gz
            bin/antlion-app-x86_64.AppImage
            bin/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
